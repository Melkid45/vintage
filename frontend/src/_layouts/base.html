<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="@/global.scss" />
  <title>Vintage</title>
  <script>
    (() => {
      try {
        const key = 'vintage-preloader-played'
        const navigation = performance.getEntriesByType('navigation')[0]
        const shouldShow = navigation?.type === 'reload' || sessionStorage.getItem(key) !== '1'

        document.documentElement.classList.toggle('preloader-skip', !shouldShow)
      } catch {
        document.documentElement.classList.remove('preloader-skip')
      }
    })()
  </script>
</head>

</body>

</html>
